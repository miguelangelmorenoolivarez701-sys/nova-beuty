<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Nova Beauty</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles (1).css') }}">
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  <section class="auth-container">
    <div class="logo-box">
      <img src="{{ url_for('static', filename='img/image (1).png') }}" alt="Nova Beauty Logo" class="logo">
      <h1>NOVA BEAUTY</h1>
    </div>

    <h2>Crear Cuenta</h2>

    <form method="post">
      <input type="text" name="name" placeholder="Nombre completo" required>
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <input type="password" name="confirm_password" placeholder="Confirmar contraseña" required>
      <button class="btn primary" type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="{{ url_for('iniciar_sesion') }}">Inicia sesión</a></p>
  </section>
</body>
</html>
