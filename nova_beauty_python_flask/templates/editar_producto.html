<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar producto - Nova Beauty</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles (1).css') }}">
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
<main class="container" style="padding:30px 15px;">
  <section class="admin-panel">
    <h2>Editar producto</h2>
    <form method="post">
      <div class="admin-grid">
        <input type="text" name="nombre" value="{{ producto.nombre }}" required>
        <input type="text" name="categoria" value="{{ producto.categoria }}" required>
        <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required>
        <input type="text" name="imagen" value="{{ producto.imagen or '' }}">
        <textarea name="descripcion">{{ producto.descripcion or '' }}</textarea>
      </div>
      <div class="admin-actions">
        <button class="btn primary" type="submit">Actualizar</button>
        <a class="btn ghost" href="{{ url_for('pagina_proyecto') }}">Volver</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
